services:
  mirofish:
    # 本地建置：selfhost-graphiti 分支的後端不在上游 image 裡。
    # 因為是本地 image，watchtower 無法更新它（已從其清單移除）。
    build:
      context: .
      dockerfile: Dockerfile
    image: mirofish:selfhost-graphiti
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "100.90.255.68:3000:3000"
      - "100.90.255.68:5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    networks:
      # graphiti-mcp:6379 —— 自架 Graphiti 的 FalkorDB
      - graphiti
      # ollama:11434 —— embedding 備援（主力走 GPU 機的 tailscale 位址）
      - ollamanet
      - default

networks:
  graphiti:
    name: graphiti_default
    external: true
  ollamanet:
    name: litellm_default
    external: true
  default: {}
