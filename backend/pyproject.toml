[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",

    # 自建 Graphiti（本地知识图谱，替代 Zep Cloud；需与 graphiti-mcp 容器版本一致）
    "graphiti-core[falkordb]==0.28.2",
    # falkordb 1.6.2 会向 redis-py 传 himport_registry，与 redis 8.x 不兼容。
    # 锁到 graphiti-mcp 容器同款组合（falkordb 1.6.0 + redis 7.3.x）。
    "falkordb==1.6.0",
    "redis>=7.3.0,<8",

    # neo4j 驱动版本对齐：camel-oasis 锁定 5.23.0，graphiti-core 需要 >=5.26.0。
    # 实际运行使用 5.26+（driver 小版本向后兼容，OASIS 不受影响）。
    "neo4j>=5.26.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.uv]
# camel-oasis==0.2.5 锁定 neo4j==5.23.0，与 graphiti-core 的 neo4j>=5.26.0 冲突；
# neo4j driver 小版本向后兼容，统一强制使用 5.26+。
override-dependencies = ["neo4j>=5.26.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
